[build-system]
requires = ["flit_core >=3.2,<4",  "requests==2.32.2"]
build-backend = "flit_core.buildapi"

[project]
name = "LaSSI"
authors = [
    {name = "Oliver R. Fox", email = "ollie.fox5@gmail.com"},
    {name = "Giacomo Bergami", email = "bergamigiacomo@gmail.com"},
]
#readme = "README.md"
requires-python = ">=3.10"
#classifiers = ["License :: OSI Approved :: MIT License"]
dynamic = ["version", "description"]
dependencies = [
    "requests==2.32.2",
    "rdflib_sqlalchemy",
    "pydot",
    "sqlalchemy-utils",
    "drawsvg[all]",
    "psycopg2-binary==2.9.9",
