    "torch==2.5.1",
    "stanza==1.8.1",
    "news-please==1.5.35",
    "newspaper3k==0.2.8",
    "bs4==0.0.1",
    "feedfinder2==0.0.4",
    "feedparser==6.0.10",
    "dateparser==1.1.8",
    "python-dateutil==2.8.2",
    "certifi==2024.7.4",
    "lxml==4.9.3",
    "colorama==0.4.6",
    "pytz==2023.3.post1",
    "plotille==5.0.0",
    "urllib3==2.2.2",
    "antlr4-python3-runtime==4.13.1",
    "StanfordNLPExtractor @ git+https://github.com/datagram-db/stanfordnlp_dg_server.git",
    "FunctionalMatch @ git+https://github.com/foxr1/FunctionalMatch.git",
    "PyDatagramDB @ git+https://github.com/foxr1/datagram-db.git@fix-macos-build",
    "pyoxigraph",
    "pandas==2.2.3",
    "dacite",
    "jsonpath_ng==1.7.0",
    "websockets==13.0.1",
    "fastapi==0.115.0",
    "uvicorn==0.30.6",
    "numpy==1.26.4",
    "tqdm",
    "markov-clustering==0.0.6.dev0",
