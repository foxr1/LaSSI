    "networkx==3.4.1",
    "plotnine",
    "sentence-transformers==2.6.0",
    "matplotlib",
    "dash",
    "dash_table",
    "dashvis",
    "dash_bootstrap_components",
    "flask",
    "latextools",
    "scikit-learn-extra",
    "ragatouille",
