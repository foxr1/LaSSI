- 'Roadworks on Meadowdale Crescent: Excavate on existing valve chamber to renew cover.. Delays unlikely. Work expected to end 2026-04-29.'
- Roadworks are taking place on Meadowdale Crescent to renew a valve chamber cover, with delays considered unlikely before work ends on 29 April.
- Roadworks to renew a valve chamber cover are currently taking place on Stakeford Lane with delays considered unlikely.
- The roadworks on Meadowdale Crescent are being carried out by Northumbrian Water as part of a wider network upgrade.
