- 'Roadworks on Church Road: Install fire valve. Delays unlikely. Work expected to end 2026-04-17.'
- Roadworks are taking place on Church Road to install a fire valve, with delays considered unlikely before work ends on 17 April.
- Roadworks to install a fire valve are taking place on Chapel Road, with delays considered unlikely before work ends on 17 April.
- The Church Road roadworks to install a fire valve are being carried out by Northumbrian Water as part of upgrades to improve fire service water supply pressure in the area.
